<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
</head>
<body>

<h2>Add Product</h2>

<form id="productForm" enctype="multipart/form-data">
    <label>Product Name</label><br>
    <input type="text" name="name" required><br><br>

    <label>Description</label><br>
    <textarea name="description"></textarea><br><br>

    <label>Price</label><br>
    <input type="number" name="price" step="0.01" required><br><br>

    <label>Original Price</label><br>
    <input type="number" name="originalPrice" step="0.01"><br><br>

    <label>Selling Price</label><br>
    <input type="number" name="selling_price" step="0.01"><br><br>

    <label>Rating</label><br>
    <input type="number" name="rating" min="0" max="5" step="0.1"><br><br>

    <label>In Stock</label><br>
    <input type="checkbox" name="inStock" checked><br><br>

    <label>Quantity</label><br>
    <input type="number" name="quantity"><br><br>

    <label>App User ID</label><br>
    <input type="number" name="app_user_id"><br><br>

    <label>Product Image</label><br>
    <input type="file" name="file" accept="image/*"><br><br>

    <button type="submit">Save Product</button>
</form>

<script>
document.getElementById("productForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const form = document.getElementById("productForm");
    const formData = new FormData(form);

    fetch("http://localhost:8082/api/products/add", {
        method: "POST",
        body: formData
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Failed to save product");
        }
        return response.json();
    })
    .then(data => {
        alert("Product added successfully!");
        console.log(data);
        form.reset();
    })
    .catch(error => {
        console.error("Error:", error);
        alert("Error saving product");
    });
});

</script>
</body>
</html>
